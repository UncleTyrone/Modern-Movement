[project]
name = "Modern_Movement"
version = "3.62.0"
description = "Modern Movement 3.62.0 for Borderlands 2 and The Pre-Sequel. Next minor after the shipped 3.61.2 Pre-Sequel package."
readme = false
requires-python = ">=3.10"
authors = [
    { name = "UncleTyrone" },
]

[project.entry-points."sdkmods"]
Modern_Movement = "Modern_Movement:build_mod"

[tool.sdkmod]
supported_game = "BL2,TPS"
coop = "Optional"
networking_min = "1.2"
package_root = "Modern_Movement"
wire_identifiers = ["ModernMovement:C2H", "ModernMovement:H2C"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"