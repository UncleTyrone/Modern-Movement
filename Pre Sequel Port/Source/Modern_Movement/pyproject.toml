[project]
name = "Modern_Movement"
version = "3.62.0"
description = "Modern Movement for Borderlands: The Pre-Sequel with host-authoritative co-op support (optional for peers without the mod)."
readme = false
requires-python = ">=3.10"
authors = [
    { name = "Jinxxtt" },
    { name = "TPS co-op port and packaging maintainers" },
]

[project.entry-points."sdkmods"]
Modern_Movement = "Modern_Movement:build_mod"

[tool.sdkmod]
supported_game = "TPS"
coop = "Optional"
networking_min = "1.2"
package_root = "Modern_Movement"
wire_identifiers = ["ModernMovement:C2H", "ModernMovement:H2C"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"