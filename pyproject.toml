[project]
name = "modern-movement-tps-coop-tooling"
version = "0.1.0"
description = "Automated verification and deterministic packaging for TPS Modern Movement co-op"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Pre Sequel Port/Source", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"